name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm audit:prod
      - name: Validate all D1 migrations on a fresh database
        run: pnpm --filter @dropvault/api exec wrangler d1 migrations apply dropvault --local --persist-to "$RUNNER_TEMP/dropvault-d1"
      - name: Validate the production Worker bundle and bindings
        run: pnpm --filter @dropvault/api exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/dropvault-worker"

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dropvault/web exec playwright install --with-deps chromium
      - run: pnpm --filter @dropvault/web test:e2e

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-$ github.ref 
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @dropvault/web typecheck
      - run: pnpm --filter @dropvault/api typecheck
      - run: pnpm --filter @dropvault/web test
      - run: pnpm --filter @dropvault/api test
      - run: pnpm --filter @dropvault/web build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @dropvault/web exec playwright install --with-deps chromium
      - run: pnpm --filter @dropvault/web test:e2e

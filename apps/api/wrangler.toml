name = "dropvault-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Files live in R2
[[r2_buckets]]
binding = "FILES"
bucket_name = "dropvault-files"

# Users, sessions, and file metadata live in D1
[[d1_databases]]
binding = "DB"
database_name = "dropvault"
database_id = "b72b57d4-bbb9-4810-a006-251d9aed1955"
migrations_dir = "migrations"

# Hourly expiry sweep
[triggers]
crons = ["0 * * * *"]

# Non-secret vars. Secrets go via `wrangler secret put` (see README).
[vars]
PUBLIC_APP_URL = "https://drop-vault.pages.dev"
R2_ACCOUNT_ID = "3ece4993f323ece88322161931be6e72"
R2_BUCKET_NAME = "dropvault-files"
DEFAULT_EXPIRY_DAYS = "2"
MAX_EXPIRY_DAYS = "30"

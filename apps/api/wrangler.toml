name = "dropvault-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Files live in R2
[[r2_buckets]]
binding = "FILES"
bucket_name = "dropvault-files"

# Users, sessions, and file metadata live in D1
[[d1_databases]]
binding = "DB"
database_name = "dropvault"
database_id = "b72b57d4-bbb9-4810-a006-251d9aed1955"
migrations_dir = "migrations"

# Hourly expiry sweep
[triggers]
crons = ["0 * * * *"]

# Non-secret vars. Secrets go via the dashboard / `wrangler secret put` (see DEPLOYMENT.md).
[vars]
# The web app proxies /api/* to this Worker, so better-auth uses PUBLIC_APP_URL
# as its baseURL (same-origin from the browser). API_URL is the Worker's own URL,
# kept as the Pages proxy target.
API_URL = "https://dropvault-api.neil27.workers.dev"
PUBLIC_APP_URL = "https://drop-vault.pages.dev"
R2_ACCOUNT_ID = "3ece4993f323ece88322161931be6e72"
R2_BUCKET_NAME = "dropvault-files"
DEFAULT_EXPIRY_DAYS = "7"
MAX_EXPIRY_DAYS = "30"
# Comma-separated list of emails treated as admins (env-based allowlist).
ADMIN_EMAILS = "ot.robinson2@gmail.com"

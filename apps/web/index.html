<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/dropvault-icon.svg" />
    <title>Dropvault — files that drift away</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply a personal choice or the last-known workspace default before the
      // app loads. The workspace value is refreshed from the API after mount.
      (function () {
        try {
          var allowed = ["neubrutalism", "quiet", "light", "dark", "sunset"];
          var t =
            localStorage.getItem("dropvault-theme") ||
            localStorage.getItem("dropvault-workspace-theme") ||
            "neubrutalism";
          if (allowed.indexOf(t) === -1) t = "neubrutalism";
          if (t !== "light") {
            document.documentElement.classList.add(t);
          }
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme =
            t === "dark" || t === "sunset" ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="overscroll-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

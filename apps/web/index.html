<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dropvault — files that drift away</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved appearance before first paint to avoid a flash of the
      // wrong theme. No saved preference (or "auto") follows the operating
      // system's light/dark setting.
      (function () {
        try {
          var t = localStorage.getItem("dropvault-theme")
          var systemDark =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
          var resolved =
            t === "light" || t === "dark" || t === "sunset"
              ? t
              : systemDark
                ? "dark"
                : "light"
          if (resolved === "dark" || resolved === "sunset") {
            document.documentElement.classList.add(resolved)
            document.documentElement.style.colorScheme = "dark"
          } else {
            document.documentElement.style.colorScheme = "light"
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

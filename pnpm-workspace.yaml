packages:
  - "apps/*"

overrides:
  esbuild: 0.28.1
  nanoid: 3.3.18
  vite: 8.1.5

# These exact direct/locked releases were intentionally reviewed and pinned.
# Keep pnpm 11's one-day quarantine for every other newly published package.
minimumReleaseAgeExclude:
  - "@cloudflare/vitest-pool-workers@0.21.2"
  - "@cloudflare/workers-types@5.20260717.1"
  - "autoprefixer@10.5.4"
  - "hono@4.12.34"
  - "postcss@8.5.23"
  - "obug@2.1.4"
  - "vite@8.1.5"
  - "wrangler@4.122.0"
  - miniflare@5.20260811.0-alpha

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
